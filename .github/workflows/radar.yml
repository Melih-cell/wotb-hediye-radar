name: Blitz Radar TR — 7/24 Bulut Radarı

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      send_test_cards:
        description: 'Telegram uzerine 3 canli test kartini gonder'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wotb-hediye-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hediye ve haber radarını çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_USERNAME: blitzradartr
          BOT_USERNAME: blitzradartr_bot
          SEND_TEST_CARDS: ${{ github.event.inputs.send_test_cards }}
        run: node src/index.mjs

      - name: Görülen kayıtları güncelle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if [ -f state/subscribers.enc ]; then
            git add state/subscribers.enc
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update seen items [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
